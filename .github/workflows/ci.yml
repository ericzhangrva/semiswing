name: SemiSwing Tier 1 Institutional CI Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1-ci-guard:
    name: Causal Invariance, Risk Bounds & Gate Regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run Tier 1 Test Suite (Causal Invariance, PIT Purity & Gate Manifest Freshness)
        run: |
          pytest tests/ -v
